<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="theme.js?v=4"></script>
    <title>room — Maroesl</title>
    <meta name="description" content="Maroesl 的room空间。">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e44942'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-size='49' fill='white'%3E♠%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="room.css?v=9">
    <script type="module" src="room.js?v=126"></script>
</head>

<body>
    <main id="room-canvas" tabindex="0" role="group"
        aria-label="可交互的三维房间。点击唱片柜台面上方悬浮的传送枪可打开或关闭柜旁墙上的传送门。鼠标悬浮电脑桌上的笔记本可查看预计退休倒计时。鼠标悬浮唱片柜下层的唱片可预览封面，点击《赤与青》、《鱼仔》、《我想念》或《在深秋》唱片播放歌曲；点击唱片机或按 R 键可暂停或继续。点击电脑返回首页，点击床头灯或桌面台灯切换明暗模式，点击床头柜或书桌抽屉可开合，L键也可切换灯光。在四面墙和天花板包围的房间内拖动进行360度转头环视，松手后平滑停止，WASD或方向键移动，Home 复位，空格暂停或播放动画。">
    </main>
    <audio id="record-audio" preload="metadata" src="audio/赤与青.m4a"></audio>
    <span id="record-status" role="status" aria-live="polite" class="visually-hidden">唱片机已暂停</span>
    <aside id="home-preview" aria-hidden="true" aria-label="首页预览"><iframe src="index.html" title="Maroesl 首页预览"
            tabindex="-1" scrolling="no"></iframe></aside>
    <aside id="record-preview" aria-hidden="true"><img alt="">
        <div><span>VINYL COLLECTION</span><strong></strong><small></small></div>
    </aside>
    <aside id="retirement-preview" aria-hidden="true" aria-label="预计退休倒计时"><span class="retirement-eyebrow">FUTURE NOTE
            · 退休倒计时</span>
        <div class="retirement-days"><strong id="retirement-days">—</strong><span>天</span></div>
        <div id="retirement-clock" class="retirement-clock">00 时 00 分 00 秒</div>
        <p>预计退休日期：2067 年 6 月 22 日</p>
    </aside>
    <div id="room-loading" role="status" aria-label="正在加载房间"><span aria-hidden="true"></span></div>
</body>

</html>
